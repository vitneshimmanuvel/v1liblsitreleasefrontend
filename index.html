<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibList - Complete Banking Repository Management</title>
    <!-- Google Fonts: Poppins (Identified from Bank Regulatory Guidelines) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#0057B8',
                50: '#F0F6FD',
                100: '#E1EDFB',
                200: '#B8D7F7',
                300: '#8AC0F2',
                400: '#3D9AE9',
                500: '#0057B8',
                600: '#004EA6',
                700: '#00428C',
                800: '#00346E',
                900: '#002550',
              },
              brand: {
                DEFAULT: '#0057B8',
                hover: '#004EA6',
                light: '#EBF4FC',
                border: '#B8D7F7',
              }
            },
            fontFamily: {
              sans: ['Poppins', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 87, 184, 0.04), 0 1px 2px -1px rgba(15, 23, 42, 0.05)',
              'card-hover': '0 4px 14px -2px rgba(0, 87, 184, 0.10), 0 2px 6px -1px rgba(15, 23, 42, 0.05)',
              'modal': '0 20px 40px -15px rgba(0, 37, 80, 0.25)',
              'primary-sm': '0 2px 8px -1px rgba(0, 87, 184, 0.35)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] font-sans antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
